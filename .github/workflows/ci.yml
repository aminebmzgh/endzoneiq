# Checks for every push and pull request. Also called by deploy.yml, so a
# failing lint/type/test run blocks any deploy.
name: CI

on:
  push:
    branches-ignore: [main] # main runs these checks inside deploy.yml
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  web:
    name: Web (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: endzoneiq
          MARIADB_USER: endzoneiq
          MARIADB_PASSWORD: endzoneiq
          MARIADB_ROOT_PASSWORD: endzoneiq-root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DATABASE_URL: mysql://endzoneiq:endzoneiq@127.0.0.1:3306/endzoneiq
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  pipeline:
    name: Pipeline (ruff, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
