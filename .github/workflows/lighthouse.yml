# Lighthouse (mobile) for production via Google PageSpeed Insights (spec Phase 4:
# >= 90 on home and game pages). Google runs Lighthouse on its own hardware, so scores
# are comparable run to run. (Running Lighthouse on a GitHub runner doesn't work:
# Hostinger's bot filter answers 403 to browsers from datacenter IPs.)
#
# Optional secret PSI_API_KEY (free, Google Cloud console, "PageSpeed Insights API"):
# without it the shared keyless quota is often exhausted (HTTP 429).
name: Lighthouse

on:
  workflow_dispatch:
    inputs:
      min_performance:
        description: "Fail below this mobile performance score"
        required: false
        default: "90"

permissions:
  contents: read

jobs:
  lighthouse:
    name: PageSpeed Insights (mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      MIN_PERF: ${{ inputs.min_performance }}
      PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
    steps:
      - name: Audit
        run: |
          game=$(curl -fsS "$SITE_URL/sitemap.xml" | grep -o "$SITE_URL/en/game/[^<]*" | head -1)
          mkdir -p reports
          status=0
          for url in "$SITE_URL/en" "$game" "$SITE_URL/fr/record"; do
            # Warm the page cache first: a page renders once, then it's served from cache.
            curl -fsS -o /dev/null "$url"
            name=$(echo "$url" | sed 's|https\?://[^/]*/||; s|/|_|g')
            q="url=$(jq -rn --arg u "$url" '$u|@uri')&strategy=mobile"
            for c in performance accessibility best-practices seo; do q="$q&category=$c"; done
            [[ -n "$PSI_API_KEY" ]] && q="$q&key=$PSI_API_KEY"
            curl -sS --max-time 180 "https://www.googleapis.com/pagespeedonline/v5/runPagespeed?$q" -o "reports/$name.json"
            jq -e '.lighthouseResult' "reports/$name.json" > /dev/null || { jq '.error.message' "reports/$name.json"; status=1; continue; }
            jq -r --arg url "$url" '.lighthouseResult as $l | "\($url) " +
              ([$l.categories[] | "\(.id)=\(.score * 100 | round)"] | join(" ")) +
              " LCP=\($l.audits["largest-contentful-paint"].displayValue)" +
              " TBT=\($l.audits["total-blocking-time"].displayValue)" +
              " CLS=\($l.audits["cumulative-layout-shift"].displayValue)"' "reports/$name.json"
            perf=$(jq '.lighthouseResult.categories.performance.score * 100 | round' "reports/$name.json")
            (( perf >= MIN_PERF )) || status=1
          done
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pagespeed
          path: reports
