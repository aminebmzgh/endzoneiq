# Model training (spec 7.3, 12.1). Model files are published as a GitHub Release
# (never MySQL) and the version is registered through the signed internal API.
#
# Weekly schedule: during the season only Elo and rolling features change, and
# they are computed at prediction time, so the scheduled run retrains only in the
# offseason. Manual runs always retrain.
name: Retrain model

on:
  schedule:
    - cron: "0 9 * * 2" # Tuesday 04:00 US Eastern (EST); 05:00 during EDT
  workflow_dispatch:
    inputs:
      backtest:
        description: "Also run the walk-forward backtest and upload the report"
        type: boolean
        default: false
      activate:
        description: "Make the new version the active model"
        type: boolean
        default: true

permissions:
  contents: write # create the model release

concurrency:
  group: retrain
  cancel-in-progress: false

jobs:
  train:
    name: Train, publish, register
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: pipeline
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
      PIPELINE_CACHE_DIR: ${{ github.workspace }}/pipeline/.cache/nflverse
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      # Aggregated play-by-play per season (a few MB). Completed seasons never change.
      - uses: actions/cache@v4
        with:
          path: pipeline/.cache/nflverse
          key: nflverse-agg-${{ hashFiles('pipeline/endzoneiq_pipeline/model/data.py') }}-${{ github.run_id }}
          restore-keys: nflverse-agg-${{ hashFiles('pipeline/endzoneiq_pipeline/model/data.py') }}-
      - run: uv sync --locked --no-dev

      - name: Train
        run: |
          flags=()
          [[ "${{ github.event_name }}" == "schedule" ]] && flags+=(--only-offseason)
          uv run --no-dev python -m endzoneiq_pipeline.jobs.train_model --out model-out "${flags[@]}"

      - name: Publish GitHub Release
        id: release
        run: |
          if [[ ! -f model-out/VERSION ]]; then echo "skipped=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          name="$(cat model-out/VERSION)"
          tag="model-${name}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            tar -czf "${tag}.tar.gz" -C model-out .
            gh release create "$tag" "${tag}.tar.gz" --title "Model ${name}" --target "$GITHUB_SHA" \
              --notes "Trained by run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Backtest: docs/backtest.md."
          else
            echo "release $tag already exists (same training data): reusing it"
          fi
          echo "url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${tag}" >> "$GITHUB_OUTPUT"

      - name: Register model version
        if: steps.release.outputs.skipped != 'true'
        run: |
          flags=()
          [[ "${{ inputs.activate }}" == "false" ]] && flags+=(--no-activate)
          uv run --no-dev python -m endzoneiq_pipeline.jobs.register_model model-out \
            --artifact-url "${{ steps.release.outputs.url }}" "${flags[@]}"

      - name: Backtest
        if: inputs.backtest
        run: uv run --no-dev python -m endzoneiq_pipeline.jobs.backtest --out backtest.md
      - uses: actions/upload-artifact@v4
        if: inputs.backtest
        with:
          name: backtest-report
          path: pipeline/backtest.md
